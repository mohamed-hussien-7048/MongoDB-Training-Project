<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>إدارة الأشخاص</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f0f5ff;font:14px Tahoma,sans-serif}.w{max-width:900px;margin:auto;padding:12px}.h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}h1,h2{margin:0}h1{font-size:18px}h2{font-size:14px}.s{color:#93a4bf;font-size:12px;display:flex;align-items:center;gap:6px}#statusDot{width:8px;height:8px;border-radius:50%;background:#3ee6a8}.stats{display:flex;gap:6px;margin-bottom:8px}.stats div{flex:1;background:#121a2b;border:1px solid #26334b;border-radius:6px;padding:6px;font-size:12px}.stats b{display:block;font-size:15px}.panel{background:#121a2b;border:1px solid #26334b;border-radius:6px;padding:10px;margin-bottom:8px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:120px}label{display:block;margin-bottom:3px;color:#93a4bf;font-size:12px}input{width:100%;padding:6px;border:1px solid #26334b;border-radius:4px;background:#0b1221;color:#f0f5ff}button{padding:6px 9px;border:0;border-radius:4px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.btn-primary{background:#42d9f5;color:#07121e}.btn-secondary{background:#19243a;color:#f0f5ff;border:1px solid #26334b}.btn-danger{background:#401d2b;color:#ff9bb0;border:1px solid #6b293e}.btn-small{padding:3px 6px;font-size:11px}.t{overflow:auto;border:1px solid #26334b;border-radius:4px;margin-top:6px}table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:6px;border-bottom:1px solid #26334b;text-align:right;font-size:12px}th{background:#19243a;color:#93a4bf}.actions{display:flex;gap:3px}.message{display:none;margin-bottom:6px;padding:6px;border-radius:4px;font-size:12px}.message.show{display:block}.success{color:#3ee6a8;background:#103326;border:1px solid #235844}.error{color:#ff9bb0;background:#351622;border:1px solid #6b293e}.empty{text-align:center;color:#93a4bf;padding:16px}.person-name{font-weight:700}.balance{color:#3ee6a8;font-weight:700}.cyan{color:#42d9f5}.green{color:#3ee6a8}.purple{color:#a78bfa}</style></head><body><main class=w><header class=h><h1>إدارة الأشخاص</h1><div class=s><span id=statusDot></span><span id=connectionStatus>جاري الاتصال...</span></div></header><div id=message class=message></div><section class=stats><div>الأشخاص<b class=cyan id=peopleCount>—</b></div><div>الإجمالي<b class=green id=totalBalance>—</b></div><div>المتوسط<b class=purple id=averageBalance>—</b></div></section><section class=panel><h2 id=formTitle>إضافة شخص</h2><form id=personForm><div class=row><div class=field><label for=name>الاسم</label><input id=name maxlength=100 placeholder="الاسم" required></div><div class=field><label for=balance>الرصيد</label><input id=balance type=number min=0 step=0.01 placeholder=0.00 required></div><div class=actions><button class=btn-primary id=submitButton>إضافة</button><button class=btn-secondary id=cancelButton type=button hidden>إلغاء</button></div></div></form></section><section class=panel><div class=h><h2>الأشخاص</h2><button class=btn-secondary id=refreshButton>تحديث</button></div><div class=field><label for=searchInput>بحث</label><input id=searchInput type=search placeholder="ابحث..."></div><div class=t><table><thead><tr><th>#</th><th>الاسم</th><th>الرصيد</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody id=peopleTable><tr><td colspan=5 class=empty>جاري التحميل...</td></tr></tbody></table></div></section></main><script src="app.js"></script></body></html>
